apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastex-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/MohammedBouchtaoui/FastEx.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: fastex
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true